<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 3.5em;
            color: #333;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.3em;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .emoji {
            font-size: 4em;
            margin-bottom: 20px;
            animation: wave 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes wave {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(20deg);
            }
            75% {
                transform: rotate(-20deg);
            }
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            margin: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 0.9em;
            color: #555;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5em;
            }

            .container {
                padding: 40px 30px;
            }

            p {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">👋</div>
        <h1>Hello World!</h1>
        <p>Welcome to your simple hello world app, running perfectly on your iPad!</p>
        <button onclick="changeMessage()">Click Me!</button>
        <button onclick="changeColor()">Change Color</button>
        <div class="info" id="info">
            Created with HTML, CSS, and JavaScript<br>
            Running from GitHub
        </div>
    </div>

    <script>
        const messages = [
            "Hello from GitHub! 🚀",
            "Welcome to the app! 🎉",
            "You clicked the button! 👍",
            "Having fun yet? 😄",
            "iPad-friendly app! 📱",
            "Hello World! 👋"
        ];

        const colors = [
            "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
            "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)",
            "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)",
            "linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)",
            "linear-gradient(135deg, #fa709a 0%, #fee140 100%)",
            "linear-gradient(135deg, #30cfd0 0%, #330867 100%)"
        ];

        let messageIndex = 0;
        let colorIndex = 0;

        function changeMessage() {
            messageIndex = (messageIndex + 1) % messages.length;
            document.querySelector('p').textContent = messages[messageIndex];
            document.querySelector('.emoji').style.animation = 'none';
            setTimeout(() => {
                document.querySelector('.emoji').style.animation = 'wave 2s ease-in-out infinite';
            }, 10);
        }

        function changeColor() {
            colorIndex = (colorIndex + 1) % colors.length;
            document.body.style.background = colors[colorIndex];
        }

        // Display current date and time
        function updateTime() {
            const now = new Date();
            document.getElementById('info').innerHTML =
                `Created with HTML, CSS, and JavaScript<br>Running from GitHub<br>Current time: ${now.toLocaleTimeString()}`;
        }

        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
