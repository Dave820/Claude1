<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Pipeline Simulator - React Flow</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reactflow@11.10.4/dist/umd/index.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.10.4/dist/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 1200px;
            width: 100%;
            animation: fadeIn 0.8s ease-in;
            margin-bottom: 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.1em;
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 0.9em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .flow-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            height: 600px;
            animation: fadeIn 0.8s ease-in 0.2s;
            animation-fill-mode: both;
        }

        .custom-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 120px;
        }

        .node-label {
            font-size: 0.9em;
            font-weight: bold;
            color: white;
            text-align: center;
        }

        .led-row {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 150px;
        }

        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3),
                        inset 0 0 4px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease;
        }

        .led.running {
            background: #4ade80;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.8),
                        inset 0 0 4px rgba(0, 0, 0, 0.2);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .led.passed {
            background: #3b82f6;
            box-shadow: 0 0 8px rgba(59, 130, 246, 0.6),
                        inset 0 0 4px rgba(0, 0, 0, 0.2);
        }

        .led.failed {
            background: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8),
                        inset 0 0 4px rgba(0, 0, 0, 0.2);
            animation: failPulse 0.8s ease-in-out 3;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        @keyframes failPulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.1);
            }
        }

        .react-flow__node {
            padding: 15px 25px;
            border-radius: 10px;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .react-flow__node.level-0 {
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
        }

        .react-flow__node.level-1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .react-flow__node.level-2 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .react-flow__edge-path {
            stroke: #94a3b8;
            stroke-width: 2;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .container {
                padding: 20px;
            }

            .flow-container {
                height: 500px;
            }

            .legend {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { ReactFlow, Controls, Background } = window.ReactFlow;

        // Test status constants
        const STATUS = {
            RUNNING: 'running',
            PASSED: 'passed',
            FAILED: 'failed'
        };

        // Generate random number in range
        const randomInRange = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        // Custom Node Component with status LEDs
        function TestPipelineNode({ data }) {
            return (
                <div className="custom-node">
                    <div className="node-label">{data.label}</div>
                    {data.childStatuses && data.childStatuses.length > 0 && (
                        <div className="led-row">
                            {data.childStatuses.map((status, idx) => (
                                <div key={idx} className={`led ${status}`}></div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // Generate hierarchical test pipeline structure
        function generateTestPipeline() {
            const nodes = [];
            const edges = [];
            let nodeId = 0;

            // Level 0 - Root
            const rootId = `node-${nodeId++}`;
            const level1Count = randomInRange(3, 5);
            const level1Children = [];

            nodes.push({
                id: rootId,
                type: 'testPipeline',
                data: {
                    label: 'Test Pipeline',
                    childStatuses: Array(level1Count).fill(STATUS.RUNNING),
                    level: 0
                },
                position: { x: 500, y: 50 },
                className: 'level-0'
            });

            // Level 1 - Main test suites
            const level1XStart = 200;
            const level1XSpacing = 250;

            for (let i = 0; i < level1Count; i++) {
                const level1Id = `node-${nodeId++}`;
                const level2Count = randomInRange(3, 5);
                level1Children.push({ id: level1Id, childCount: level2Count });

                nodes.push({
                    id: level1Id,
                    type: 'testPipeline',
                    data: {
                        label: `Suite ${i + 1}`,
                        childStatuses: Array(level2Count).fill(STATUS.RUNNING),
                        level: 1
                    },
                    position: { x: level1XStart + (i * level1XSpacing), y: 200 },
                    className: 'level-1'
                });

                edges.push({
                    id: `edge-${rootId}-${level1Id}`,
                    source: rootId,
                    target: level1Id,
                    style: { stroke: '#94a3b8', strokeWidth: 2 }
                });

                // Level 2 - Individual tests
                const level2XStart = level1XStart + (i * level1XSpacing) - (level2Count * 40);
                const level2XSpacing = 100;

                for (let j = 0; j < level2Count; j++) {
                    const level2Id = `node-${nodeId++}`;

                    nodes.push({
                        id: level2Id,
                        type: 'testPipeline',
                        data: {
                            label: `Test ${i + 1}.${j + 1}`,
                            childStatuses: [],
                            level: 2
                        },
                        position: { x: level2XStart + (j * level2XSpacing), y: 400 },
                        className: 'level-2'
                    });

                    edges.push({
                        id: `edge-${level1Id}-${level2Id}`,
                        source: level1Id,
                        target: level2Id,
                        style: { stroke: '#94a3b8', strokeWidth: 2 }
                    });
                }
            }

            return { nodes, edges, level1Children, level1Count };
        }

        function FlowDiagram() {
            const [pipelineData, setPipelineData] = useState(() => generateTestPipeline());
            const [nodes, setNodes] = useState(pipelineData.nodes);
            const [edges] = useState(pipelineData.edges);
            const [isRunning, setIsRunning] = useState(false);

            // Define custom node types
            const nodeTypes = useMemo(() => ({
                testPipeline: TestPipelineNode
            }), []);

            // Simulate test execution
            const runTests = useCallback(() => {
                setIsRunning(true);

                // Reset all to running
                setNodes(prevNodes => prevNodes.map(node => ({
                    ...node,
                    data: {
                        ...node.data,
                        childStatuses: node.data.childStatuses?.map(() => STATUS.RUNNING) || []
                    }
                })));

                // Get all level 2 nodes (leaf nodes)
                const level2Nodes = nodes.filter(n => n.data.level === 2);

                // Simulate each test completing after random delay
                level2Nodes.forEach((node, index) => {
                    const delay = randomInRange(1000, 4000);
                    const willPass = Math.random() > 0.2; // 80% pass rate

                    setTimeout(() => {
                        // Find parent (level 1)
                        const parentEdge = edges.find(e => e.target === node.id);
                        if (!parentEdge) return;

                        const parentId = parentEdge.source;

                        // Update level 2 status (for visual feedback)
                        setNodes(prevNodes => {
                            const newNodes = [...prevNodes];

                            // Get parent node and its children
                            const parentNode = newNodes.find(n => n.id === parentId);
                            if (!parentNode) return prevNodes;

                            const siblingEdges = edges.filter(e => e.source === parentId);
                            const childIndex = siblingEdges.findIndex(e => e.target === node.id);

                            if (childIndex !== -1) {
                                const updatedStatuses = [...parentNode.data.childStatuses];
                                updatedStatuses[childIndex] = willPass ? STATUS.PASSED : STATUS.FAILED;

                                const parentIdx = newNodes.findIndex(n => n.id === parentId);
                                newNodes[parentIdx] = {
                                    ...parentNode,
                                    data: {
                                        ...parentNode.data,
                                        childStatuses: updatedStatuses
                                    }
                                };

                                // Check if all children of this parent are complete
                                const allComplete = updatedStatuses.every(s =>
                                    s === STATUS.PASSED || s === STATUS.FAILED
                                );

                                if (allComplete) {
                                    // Update root node
                                    const rootNode = newNodes.find(n => n.data.level === 0);
                                    if (rootNode) {
                                        const allLevel1 = newNodes.filter(n => n.data.level === 1);
                                        const level1Statuses = allLevel1.map(l1Node => {
                                            const hasFailures = l1Node.data.childStatuses.some(s => s === STATUS.FAILED);
                                            const allDone = l1Node.data.childStatuses.every(s =>
                                                s === STATUS.PASSED || s === STATUS.FAILED
                                            );
                                            if (!allDone) return STATUS.RUNNING;
                                            return hasFailures ? STATUS.FAILED : STATUS.PASSED;
                                        });

                                        const rootIdx = newNodes.findIndex(n => n.data.level === 0);
                                        newNodes[rootIdx] = {
                                            ...rootNode,
                                            data: {
                                                ...rootNode.data,
                                                childStatuses: level1Statuses
                                            }
                                        };
                                    }
                                }
                            }

                            return newNodes;
                        });
                    }, delay);
                });

                // Mark as not running after max delay
                setTimeout(() => {
                    setIsRunning(false);
                }, 5000);
            }, [nodes, edges]);

            const resetPipeline = () => {
                const newPipeline = generateTestPipeline();
                setPipelineData(newPipeline);
                setNodes(newPipeline.nodes);
                setIsRunning(false);
            };

            return (
                <div className="flow-container">
                    <ReactFlow
                        nodes={nodes}
                        edges={edges}
                        nodeTypes={nodeTypes}
                        fitView
                        attributionPosition="bottom-left"
                        minZoom={0.3}
                        maxZoom={1.5}
                    >
                        <Controls />
                        <Background variant="dots" gap={12} size={1} />
                    </ReactFlow>
                </div>
            );
        }

        function App() {
            const [key, setKey] = useState(0);

            const handleRunTests = () => {
                setKey(prev => prev + 1);
            };

            return (
                <>
                    <div className="container">
                        <h1>Test Pipeline Simulator</h1>
                        <p>Hierarchical test pipeline visualization with real-time status monitoring</p>

                        <div className="controls">
                            <button onClick={handleRunTests}>Run Tests</button>
                        </div>

                        <div className="legend">
                            <div className="legend-item">
                                <div className="legend-led running"></div>
                                <span>Running</span>
                            </div>
                            <div className="legend-item">
                                <div className="legend-led passed"></div>
                                <span>Passed</span>
                            </div>
                            <div className="legend-item">
                                <div className="legend-led failed"></div>
                                <span>Failed</span>
                            </div>
                        </div>
                    </div>
                    <FlowDiagram key={key} />
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
