<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Pipeline Simulator - React Flow</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loading">
        <div>Loading Test Pipeline Simulator...</div>
        <div class="loading-status" id="load-status">Initializing...</div>
    </div>
    <div id="error-display"></div>
    <div id="root"></div>

    <script>
        // Enhanced error handler
        const errorLog = [];
        const updateStatus = (msg) => {
            const status = document.getElementById('load-status');
            if (status) status.textContent = msg;
        };

        window.addEventListener('error', function(e) {
            const errorDiv = document.getElementById('error-display');
            const msg = 'ERROR: ' + (e.message || e.error?.message || 'Unknown error') +
                        '\nFile: ' + (e.filename || 'unknown') +
                        '\nLine: ' + (e.lineno || '?') + ':' + (e.colno || '?') +
                        '\n\nAll errors:\n' + errorLog.join('\n');
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
            errorLog.push(e.message || 'Unknown error');
        });

        updateStatus('Loading dependencies...');
    </script>

    <!-- Load dependencies with error tracking -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"
            onload="updateStatus('React loaded ✓')"
            onerror="updateStatus('React FAILED to load ✗'); document.getElementById('error-display').style.display='block'; document.getElementById('error-display').textContent='Failed to load React from CDN'"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
            onload="updateStatus('ReactDOM loaded ✓')"
            onerror="updateStatus('ReactDOM FAILED ✗'); document.getElementById('error-display').style.display='block'; document.getElementById('error-display').textContent='Failed to load ReactDOM from CDN'"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"
            onload="updateStatus('Babel loaded ✓')"
            onerror="updateStatus('Babel FAILED ✗'); document.getElementById('error-display').style.display='block'; document.getElementById('error-display').textContent='Failed to load Babel from CDN'"></script>
    <script src="https://cdn.jsdelivr.net/npm/reactflow@11.10.4/dist/umd/index.min.js"
            onload="updateStatus('ReactFlow loaded ✓')"
            onerror="updateStatus('ReactFlow FAILED ✗'); document.getElementById('error-display').style.display='block'; document.getElementById('error-display').textContent='Failed to load ReactFlow from CDN'"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.10.4/dist/style.css">

    <script type="text/babel">
        updateStatus('Starting app initialization...');

        const { useState, useEffect, useMemo } = React;

        // More robust ReactFlow access
        let ReactFlowModule;
        if (window.ReactFlow) {
            ReactFlowModule = window.ReactFlow.default || window.ReactFlow;
        }

        if (!ReactFlowModule) {
            throw new Error('ReactFlow not available. window.ReactFlow = ' + typeof window.ReactFlow);
        }

        const { Controls, Background } = window.ReactFlow;

        updateStatus('React components ready...');

        // Test status constants
        const STATUS = {
            RUNNING: 'running',
            PASSED: 'passed',
            FAILED: 'failed'
        };

        const randomInRange = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        // Custom Node Component
        function TestPipelineNode({ data }) {
            // For Level 2 nodes (tests), use inline layout with LED next to label
            if (data.level === 2) {
                return React.createElement('div', { className: 'custom-node inline' },
                    React.createElement('div', { className: 'node-label' }, data.label),
                    data.status && React.createElement('div', { className: `led ${data.status}` })
                );
            }

            // For Level 0 and 1 nodes (pipeline and suites), use column layout
            return React.createElement('div', { className: 'custom-node' },
                React.createElement('div', { className: 'node-label' }, data.label),
                data.childStatuses && data.childStatuses.length > 0 &&
                    React.createElement('div', { className: 'led-row' },
                        data.childStatuses.map((status, idx) =>
                            React.createElement('div', { key: idx, className: `led ${status}` })
                        )
                    )
            );
        }

        updateStatus('Generating pipeline structure...');

        // Generate hierarchical test pipeline structure (LEFT TO RIGHT)
        function generateTestPipeline() {
            const nodes = [];
            const edges = [];
            let nodeId = 0;

            const rootId = `node-${nodeId++}`;
            const level1Count = randomInRange(3, 5);

            // Calculate vertical spacing for level 1 nodes
            const level1YSpacing = 120;
            const level1YStart = 50;

            // Level 0 - Root node on the left, centered vertically
            const rootY = level1YStart + (level1Count * level1YSpacing) / 2;

            nodes.push({
                id: rootId,
                type: 'testPipeline',
                data: {
                    label: 'Test Pipeline',
                    childStatuses: Array(level1Count).fill(STATUS.RUNNING),
                    level: 0
                },
                position: { x: 50, y: rootY },
                className: 'level-0'
            });

            // Level 1 - Test suites in the middle column
            const level1X = 350;

            for (let i = 0; i < level1Count; i++) {
                const level1Id = `node-${nodeId++}`;
                const level2Count = randomInRange(3, 5);

                const level1Y = level1YStart + (i * level1YSpacing);

                nodes.push({
                    id: level1Id,
                    type: 'testPipeline',
                    data: {
                        label: `Suite ${i + 1}`,
                        childStatuses: Array(level2Count).fill(STATUS.RUNNING),
                        level: 1
                    },
                    position: { x: level1X, y: level1Y },
                    className: 'level-1'
                });

                edges.push({
                    id: `edge-${rootId}-${level1Id}`,
                    source: rootId,
                    target: level1Id,
                    style: { stroke: '#94a3b8', strokeWidth: 2 }
                });

                // Level 2 - Individual tests on the right column
                const level2X = 700;
                const level2YSpacing = 80;
                const level2YStart = level1Y - ((level2Count - 1) * level2YSpacing) / 2;

                for (let j = 0; j < level2Count; j++) {
                    const level2Id = `node-${nodeId++}`;
                    const level2Y = level2YStart + (j * level2YSpacing);

                    nodes.push({
                        id: level2Id,
                        type: 'testPipeline',
                        data: {
                            label: `Test ${i + 1}.${j + 1}`,
                            childStatuses: [],
                            level: 2,
                            status: null // Will be set to running/passed/failed
                        },
                        position: { x: level2X, y: level2Y },
                        className: 'level-2',
                        hidden: true // Initially hide all test nodes
                    });

                    edges.push({
                        id: `edge-${level1Id}-${level2Id}`,
                        source: level1Id,
                        target: level2Id,
                        style: { stroke: '#94a3b8', strokeWidth: 2 }
                    });
                }
            }

            return { nodes, edges };
        }

        updateStatus('Creating components...');

        // Tree Panel Component
        function TreePanel({ nodes, edges }) {
            // State to track which suites are expanded (all expanded by default)
            const suiteNodes = nodes.filter(n => n.data.level === 1).sort((a, b) => a.id.localeCompare(b.id));
            const initialExpanded = {};
            suiteNodes.forEach(suite => {
                initialExpanded[suite.id] = true;
            });

            const [expandedSuites, setExpandedSuites] = useState(initialExpanded);

            // Build hierarchical structure
            const rootNode = nodes.find(n => n.data.level === 0);

            const getTestsForSuite = (suiteId) => {
                const testEdges = edges.filter(e => e.source === suiteId);
                return testEdges.map(edge => nodes.find(n => n.id === edge.target)).filter(Boolean);
            };

            const getSuiteStatus = (suite) => {
                const statuses = suite.data.childStatuses || [];
                if (statuses.some(s => s === STATUS.FAILED)) return 'failed';
                if (statuses.every(s => s === STATUS.PASSED)) return 'passed';
                if (statuses.some(s => s === STATUS.RUNNING)) return 'running';
                return 'pending';
            };

            const toggleSuite = (suiteId) => {
                setExpandedSuites(prev => ({
                    ...prev,
                    [suiteId]: !prev[suiteId]
                }));
            };

            const formatTime = (executionTime) => {
                if (executionTime === undefined || executionTime === null) return '-';
                return executionTime.toFixed(2) + 's';
            };

            return React.createElement('div', { className: 'tree-panel' },
                React.createElement('h3', null, 'Test Hierarchy'),

                // Table structure
                React.createElement('table', { className: 'tree-table' },
                    // Table headers
                    React.createElement('thead', null,
                        React.createElement('tr', null,
                            React.createElement('th', { className: 'col-name' }, 'Name'),
                            React.createElement('th', { className: 'col-status' }, 'Status'),
                            React.createElement('th', { className: 'col-time' }, 'Time')
                        )
                    ),

                    // Table body
                    React.createElement('tbody', null,
                        // Root node
                        rootNode && React.createElement('tr', {
                            className: 'tree-row level-0',
                            key: rootNode.id
                        },
                            React.createElement('td', { className: 'col-name' },
                                React.createElement('span', { className: 'tree-label' }, rootNode.data.label)
                            ),
                            React.createElement('td', { className: 'col-status' },
                                React.createElement('div', { className: 'status-badge' })
                            ),
                            React.createElement('td', { className: 'col-time' }, '-')
                        ),

                        // Suite nodes
                        suiteNodes.map(suite => {
                            const tests = getTestsForSuite(suite.id);
                            const suiteStatus = getSuiteStatus(suite);
                            const isExpanded = expandedSuites[suite.id];

                            return React.createElement(React.Fragment, { key: suite.id },
                                React.createElement('tr', {
                                    className: 'tree-row level-1',
                                    onClick: () => toggleSuite(suite.id)
                                },
                                    React.createElement('td', { className: 'col-name' },
                                        React.createElement('div', {
                                            className: `tree-toggle ${isExpanded ? '' : 'collapsed'}`
                                        }, '▼'),
                                        React.createElement('span', { className: 'tree-label' }, suite.data.label)
                                    ),
                                    React.createElement('td', { className: 'col-status' },
                                        React.createElement('div', { className: `status-badge ${suiteStatus}` })
                                    ),
                                    React.createElement('td', { className: 'col-time' }, '-')
                                ),

                                // Test nodes for this suite (only if expanded)
                                isExpanded && tests.map(test => {
                                    const isHidden = test.hidden;
                                    const testStatus = test.data.status || 'pending';
                                    const executionTime = test.data.executionTime;

                                    return React.createElement('tr', {
                                        className: `tree-row level-2 ${isHidden ? 'hidden-node' : ''}`,
                                        key: test.id
                                    },
                                        React.createElement('td', { className: 'col-name' },
                                            React.createElement('span', { className: 'tree-label' }, test.data.label)
                                        ),
                                        React.createElement('td', { className: 'col-status' },
                                            React.createElement('div', { className: `status-badge ${testStatus}` })
                                        ),
                                        React.createElement('td', { className: 'col-time' }, formatTime(executionTime))
                                    );
                                })
                            );
                        })
                    )
                )
            );
        }

        function FlowDiagram({ shouldRun, onRef }) {
            const [pipelineData] = useState(() => generateTestPipeline());
            const [nodes, setNodes] = useState(pipelineData.nodes);
            const [edges] = useState(pipelineData.edges);
            const [reactFlowInstance, setReactFlowInstance] = useState(null);

            const nodeTypes = useMemo(() => ({
                testPipeline: TestPipelineNode
            }), []);

            // Save results function
            const saveResults = () => {
                const results = {
                    timestamp: new Date().toISOString(),
                    pipeline: {},
                    suites: []
                };

                // Get root node
                const rootNode = nodes.find(n => n.data.level === 0);
                if (rootNode) {
                    const rootStatuses = rootNode.data.childStatuses || [];
                    const totalTests = nodes.filter(n => n.data.level === 2).length;
                    const failedTests = nodes.filter(n => n.data.level === 2 && n.data.status === STATUS.FAILED).length;
                    const passedTests = nodes.filter(n => n.data.level === 2 && n.data.status === STATUS.PASSED).length;
                    const runningTests = nodes.filter(n => n.data.level === 2 && n.data.status === STATUS.RUNNING).length;

                    results.pipeline = {
                        name: rootNode.data.label,
                        totalTests: totalTests,
                        passed: passedTests,
                        failed: failedTests,
                        running: runningTests,
                        status: failedTests > 0 ? 'failed' : (runningTests > 0 ? 'running' : 'passed')
                    };
                }

                // Get suite nodes
                const suiteNodes = nodes.filter(n => n.data.level === 1).sort((a, b) => a.id.localeCompare(b.id));
                suiteNodes.forEach(suite => {
                    const suiteTests = [];
                    const testEdges = edges.filter(e => e.source === suite.id);

                    testEdges.forEach(edge => {
                        const testNode = nodes.find(n => n.id === edge.target);
                        if (testNode) {
                            suiteTests.push({
                                name: testNode.data.label,
                                status: testNode.data.status || 'pending',
                                executionTime: testNode.data.executionTime || null,
                                startTime: testNode.data.startTime ? new Date(testNode.data.startTime).toISOString() : null,
                                endTime: testNode.data.endTime ? new Date(testNode.data.endTime).toISOString() : null
                            });
                        }
                    });

                    const suiteStatuses = suite.data.childStatuses || [];
                    const suiteFailed = suiteStatuses.some(s => s === STATUS.FAILED);
                    const suiteRunning = suiteStatuses.some(s => s === STATUS.RUNNING);
                    const suitePassed = suiteStatuses.every(s => s === STATUS.PASSED);

                    results.suites.push({
                        name: suite.data.label,
                        status: suiteFailed ? 'failed' : (suiteRunning ? 'running' : (suitePassed ? 'passed' : 'pending')),
                        totalTests: suiteTests.length,
                        tests: suiteTests
                    });
                });

                // Create JSON and download
                const json = JSON.stringify(results, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `test-results-${Date.now()}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            };

            // Expose saveResults function to parent
            useEffect(() => {
                if (onRef) {
                    onRef({ saveResults });
                }
            }, [nodes, edges]);

            // Auto-fit view when nodes change visibility
            useEffect(() => {
                if (reactFlowInstance) {
                    // Wait a bit for layout to settle, then fit view
                    const timer = setTimeout(() => {
                        reactFlowInstance.fitView({ padding: 0.2, duration: 400 });
                    }, 100);
                    return () => clearTimeout(timer);
                }
            }, [nodes, reactFlowInstance]);

            useEffect(() => {
                if (!shouldRun) return;

                const level2Nodes = pipelineData.nodes.filter(n => n.data.level === 2);

                level2Nodes.forEach((node) => {
                    const startDelay = randomInRange(500, 3000); // Random start time
                    const testDuration = randomInRange(1000, 3000); // Random test duration
                    const willPass = Math.random() > 0.2; // 80% pass rate

                    // Start the test - show node and set to running
                    setTimeout(() => {
                        setNodes(prevNodes => {
                            const newNodes = [...prevNodes];
                            const nodeIdx = newNodes.findIndex(n => n.id === node.id);
                            if (nodeIdx !== -1) {
                                newNodes[nodeIdx] = {
                                    ...newNodes[nodeIdx],
                                    hidden: false, // Show the node
                                    data: {
                                        ...newNodes[nodeIdx].data,
                                        status: STATUS.RUNNING, // Set own status to running
                                        startTime: Date.now() // Record start time
                                    }
                                };
                            }
                            return newNodes;
                        });
                    }, startDelay);

                    // Complete the test
                    setTimeout(() => {
                        const parentEdge = edges.find(e => e.target === node.id);
                        if (!parentEdge) return;

                        const parentId = parentEdge.source;

                        setNodes(prevNodes => {
                            const newNodes = [...prevNodes];
                            const parentNode = newNodes.find(n => n.id === parentId);
                            if (!parentNode) return prevNodes;

                            const siblingEdges = edges.filter(e => e.source === parentId);
                            const childIndex = siblingEdges.findIndex(e => e.target === node.id);

                            if (childIndex !== -1) {
                                const updatedStatuses = [...parentNode.data.childStatuses];
                                updatedStatuses[childIndex] = willPass ? STATUS.PASSED : STATUS.FAILED;

                                // Update test node's own status
                                const testNodeIdx = newNodes.findIndex(n => n.id === node.id);
                                if (testNodeIdx !== -1) {
                                    const endTime = Date.now();
                                    const startTime = newNodes[testNodeIdx].data.startTime || endTime;
                                    const executionTime = (endTime - startTime) / 1000; // Convert to seconds

                                    newNodes[testNodeIdx] = {
                                        ...newNodes[testNodeIdx],
                                        data: {
                                            ...newNodes[testNodeIdx].data,
                                            status: willPass ? STATUS.PASSED : STATUS.FAILED,
                                            endTime: endTime,
                                            executionTime: executionTime
                                        }
                                    };
                                }

                                const parentIdx = newNodes.findIndex(n => n.id === parentId);
                                newNodes[parentIdx] = {
                                    ...parentNode,
                                    data: {
                                        ...parentNode.data,
                                        childStatuses: updatedStatuses
                                    }
                                };

                                // Update root node status
                                const allComplete = updatedStatuses.every(s =>
                                    s === STATUS.PASSED || s === STATUS.FAILED
                                );

                                if (allComplete) {
                                    const rootNode = newNodes.find(n => n.data.level === 0);
                                    if (rootNode) {
                                        const allLevel1 = newNodes.filter(n => n.data.level === 1);
                                        const level1Statuses = allLevel1.map(l1Node => {
                                            const hasFailures = l1Node.data.childStatuses.some(s => s === STATUS.FAILED);
                                            const allDone = l1Node.data.childStatuses.every(s =>
                                                s === STATUS.PASSED || s === STATUS.FAILED
                                            );
                                            if (!allDone) return STATUS.RUNNING;
                                            return hasFailures ? STATUS.FAILED : STATUS.PASSED;
                                        });

                                        const rootIdx = newNodes.findIndex(n => n.data.level === 0);
                                        newNodes[rootIdx] = {
                                            ...rootNode,
                                            data: {
                                                ...rootNode.data,
                                                childStatuses: level1Statuses
                                            }
                                        };
                                    }
                                }
                            }

                            return newNodes;
                        });

                        // If test passed, hide it after 1 second
                        if (willPass) {
                            setTimeout(() => {
                                setNodes(prevNodes => {
                                    const newNodes = [...prevNodes];
                                    const nodeIdx = newNodes.findIndex(n => n.id === node.id);
                                    if (nodeIdx !== -1) {
                                        newNodes[nodeIdx] = {
                                            ...newNodes[nodeIdx],
                                            hidden: true // Hide passed nodes
                                        };
                                    }
                                    return newNodes;
                                });
                            }, 1000);
                        }
                        // If failed, keep it visible (don't hide)
                    }, startDelay + testDuration);
                });
            }, [shouldRun, edges, pipelineData.nodes]);

            return React.createElement('div', { className: 'main-content' },
                React.createElement(TreePanel, { nodes: nodes, edges: edges }),
                React.createElement('div', { className: 'flow-container' },
                    React.createElement(ReactFlowModule, {
                        nodes: nodes,
                        edges: edges,
                        nodeTypes: nodeTypes,
                        onInit: setReactFlowInstance,
                        fitView: true,
                        attributionPosition: 'bottom-left',
                        minZoom: 0.3,
                        maxZoom: 1.5
                    },
                        React.createElement(Controls),
                        React.createElement(Background, { variant: 'dots', gap: 12, size: 1 })
                    )
                )
            );
        }

        function App() {
            const [key, setKey] = useState(0);
            const [flowDiagramRef, setFlowDiagramRef] = useState(null);

            const handleRunTests = () => {
                setKey(prev => prev + 1);
            };

            const handleSaveResults = () => {
                if (flowDiagramRef && flowDiagramRef.saveResults) {
                    flowDiagramRef.saveResults();
                }
            };

            return React.createElement(React.Fragment, null,
                React.createElement('div', { className: 'container' },
                    React.createElement('h1', null, 'Test Pipeline Simulator'),
                    React.createElement('p', null, 'Hierarchical test pipeline visualization with real-time status monitoring'),
                    React.createElement('div', { className: 'controls' },
                        React.createElement('button', { onClick: handleRunTests }, 'Run Tests'),
                        React.createElement('button', { onClick: handleSaveResults }, 'Save Results')
                    ),
                    React.createElement('div', { className: 'legend' },
                        React.createElement('div', { className: 'legend-item' },
                            React.createElement('div', { className: 'legend-led running' }),
                            React.createElement('span', null, 'Running')
                        ),
                        React.createElement('div', { className: 'legend-item' },
                            React.createElement('div', { className: 'legend-led passed' }),
                            React.createElement('span', null, 'Passed')
                        ),
                        React.createElement('div', { className: 'legend-item' },
                            React.createElement('div', { className: 'legend-led failed' }),
                            React.createElement('span', null, 'Failed')
                        )
                    )
                ),
                React.createElement(FlowDiagram, { key: key, shouldRun: true, onRef: setFlowDiagramRef })
            );
        }

        updateStatus('Rendering app...');

        try {
            const rootElement = document.getElementById('root');
            const root = ReactDOM.createRoot(rootElement);
            root.render(React.createElement(App));

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                updateStatus('App loaded successfully! ✓');
            }, 100);
        } catch (error) {
            const errorDiv = document.getElementById('error-display');
            errorDiv.style.display = 'block';
            errorDiv.textContent = 'RENDER ERROR:\n' + error.message + '\n\nStack:\n' + error.stack;
        }
    </script>
</body>
</html>
