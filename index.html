<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World App - React Flow</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reactflow@11.10.4/dist/umd/index.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reactflow@11.10.4/dist/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 900px;
            width: 100%;
            animation: fadeIn 0.8s ease-in;
            margin-bottom: 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 3.5em;
            color: #333;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.3em;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .emoji {
            font-size: 4em;
            margin-bottom: 20px;
            animation: wave 2s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes wave {
            0%, 100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(20deg);
            }
            75% {
                transform: rotate(-20deg);
            }
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            margin: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 0.9em;
            color: #555;
        }

        .flow-container {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            height: 400px;
            animation: fadeIn 0.8s ease-in 0.2s;
            animation-fill-mode: both;
        }

        .react-flow__node {
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 2em;
            font-weight: bold;
            color: white;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .react-flow__node.green-node {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
        }

        .react-flow__node.red-node {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .react-flow__edge-path {
            stroke: #667eea;
            stroke-width: 3;
        }

        .react-flow__edge.animated .react-flow__edge-path {
            stroke-dasharray: 5;
            animation: dashdraw 0.5s linear infinite;
        }

        @keyframes dashdraw {
            to {
                stroke-dashoffset: -10;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2.5em;
            }

            .container {
                padding: 30px 20px;
            }

            p {
                font-size: 1.1em;
            }

            .flow-container {
                height: 300px;
            }

            .react-flow__node {
                padding: 15px 30px;
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;
        const { ReactFlow, Controls, Background } = window.ReactFlow;

        const MESSAGES = [
            "Hello from GitHub! 🚀",
            "Welcome to the app! 🎉",
            "You clicked the button! 👍",
            "Having fun yet? 😄",
            "iPad-friendly app! 📱",
            "Hello World! 👋"
        ];

        const COLORS = [
            "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
            "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)",
            "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)",
            "linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)",
            "linear-gradient(135deg, #fa709a 0%, #fee140 100%)",
            "linear-gradient(135deg, #30cfd0 0%, #330867 100%)"
        ];

        // Define initial nodes
        const initialNodes = [
            {
                id: '1',
                type: 'default',
                data: { label: 'Hello' },
                position: { x: 100, y: 150 },
                className: 'green-node',
                style: {
                    background: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                    color: 'white',
                    border: 'none',
                    fontSize: '2em',
                    fontWeight: 'bold',
                    padding: '20px 40px',
                    borderRadius: '10px',
                    boxShadow: '0 4px 15px rgba(0, 0, 0, 0.2)'
                }
            },
            {
                id: '2',
                type: 'default',
                data: { label: 'World' },
                position: { x: 400, y: 150 },
                className: 'red-node',
                style: {
                    background: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                    color: 'white',
                    border: 'none',
                    fontSize: '2em',
                    fontWeight: 'bold',
                    padding: '20px 40px',
                    borderRadius: '10px',
                    boxShadow: '0 4px 15px rgba(0, 0, 0, 0.2)'
                }
            }
        ];

        // Define initial edges
        const initialEdges = [
            {
                id: 'e1-2',
                source: '1',
                target: '2',
                animated: true,
                style: { stroke: '#667eea', strokeWidth: 3 }
            }
        ];

        function FlowDiagram() {
            const [nodes, setNodes] = useState(initialNodes);
            const [edges, setEdges] = useState(initialEdges);

            return (
                <div className="flow-container">
                    <ReactFlow
                        nodes={nodes}
                        edges={edges}
                        fitView
                        attributionPosition="bottom-left"
                    >
                        <Controls />
                        <Background variant="dots" gap={12} size={1} />
                    </ReactFlow>
                </div>
            );
        }

        function App() {
            const [messageIndex, setMessageIndex] = useState(5);
            const [colorIndex, setColorIndex] = useState(0);
            const [currentTime, setCurrentTime] = useState(new Date());

            useEffect(() => {
                // Update background color
                document.body.style.background = COLORS[colorIndex];
            }, [colorIndex]);

            useEffect(() => {
                // Update time every second
                const timer = setInterval(() => {
                    setCurrentTime(new Date());
                }, 1000);

                return () => clearInterval(timer);
            }, []);

            const handleChangeMessage = () => {
                setMessageIndex((prev) => (prev + 1) % MESSAGES.length);
            };

            const handleChangeColor = () => {
                setColorIndex((prev) => (prev + 1) % COLORS.length);
            };

            return (
                <>
                    <div className="container">
                        <div className="emoji">👋</div>
                        <h1>Hello World!</h1>
                        <p>{MESSAGES[messageIndex]}</p>
                        <button onClick={handleChangeMessage}>Click Me!</button>
                        <button onClick={handleChangeColor}>Change Color</button>
                        <div className="info">
                            Created with React Flow, React, HTML, and CSS<br />
                            Running from GitHub<br />
                            Current time: {currentTime.toLocaleTimeString()}
                        </div>
                    </div>
                    <FlowDiagram />
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
